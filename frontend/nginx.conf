# phục vụ giao diện và chuyển /api sang backend trong cùng mạng compose
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # tải tài liệu lên tới 100 MB (khớp giới hạn multipart của backend)
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # SSE (/api/v1/ask): đẩy từng sự kiện ra ngay, không gom bộ đệm; câu trả lời có thể mất vài phút
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # ứng dụng một trang: đường dẫn lạ thì trả index.html
    location / {
        try_files $uri /index.html;
    }

    # file đã băm tên (assets/*) đổi khi build lại nên được giữ lâu
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
