<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cleaner Studio</title>
<style>
  :root { --nen:#3C3C3C; --nen2:#333; --do:#E3350D; --chu:#E8E8E8; --mo:#9A9A9A; --vien:#4A4A4A; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--nen); color:var(--chu);
         font:13px/1.5 "Cascadia Mono","Consolas",ui-monospace,monospace; }
  header { padding:14px 16px; border-bottom:1px solid var(--vien); display:flex;
           align-items:center; gap:14px; flex-wrap:wrap; }
  h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:.5px; }
  h1 span { color:var(--do); }
  button { background:var(--do); color:#fff; border:0; padding:7px 16px; border-radius:3px;
           font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { background:#5A5A5A; cursor:default; }
  .so { color:var(--mo); }
  .so b { color:var(--chu); font-weight:600; }
  main { display:grid; grid-template-columns:minmax(380px,46%) 1fr; height:calc(100vh - 57px); }
  .trai { overflow:auto; border-right:1px solid var(--vien); }
  .phai { overflow:auto; padding:14px 16px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:5px 10px; border-bottom:1px solid var(--vien);
          white-space:nowrap; }
  th { position:sticky; top:0; background:var(--nen2); font-weight:600; color:var(--mo);
       font-size:11px; text-transform:uppercase; letter-spacing:.6px; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:var(--nen2); }
  tbody tr.chon { background:#4A3030; }
  td.duong { white-space:normal; word-break:break-all; max-width:0; width:99%; }
  td.phantram { text-align:right; font-weight:600; }
  .cao { color:var(--do); }
  .cot2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  pre { background:var(--nen2); border:1px solid var(--vien); border-radius:3px;
        padding:10px; overflow:auto; max-height:calc(100vh - 150px);
        white-space:pre-wrap; word-break:break-word; margin:6px 0 0; font-size:12px; }
  .nhan { color:var(--mo); font-size:11px; text-transform:uppercase; letter-spacing:.6px; }
  .trong { color:var(--mo); padding:30px 0; text-align:center; }
</style>
</head>
<body>

<header>
  <h1>Cleaner <span>Studio</span></h1>
  <button id="chay">Quét toàn kho</button>
  <div class="so" id="tomtat">chưa chạy</div>
</header>

<main>
  <div class="trai">
    <table>
      <thead>
        <tr><th>Trang</th><th>&nbsp;</th><th>```</th><th>Bỏ</th><th>%</th></tr>
      </thead>
      <tbody id="bang">
        <tr><td colspan="5" class="trong">Bấm “Quét toàn kho” để bắt đầu</td></tr>
      </tbody>
    </table>
  </div>

  <div class="phai" id="chitiet">
    <div class="trong">Chọn một trang ở bảng bên trái để xem trước và sau</div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let dangChon = null;

$("chay").onclick = async () => {
  $("chay").disabled = true;
  $("tomtat").textContent = "đang quét…";
  try {
    const r = await fetch("/api/audit");
    const d = await r.json();
    if (d.loi) throw new Error(d.loi);
    if (!r.ok || !Array.isArray(d.pages)) {
      throw new Error("Backend loi (" + r.status + "): " + (d.message || d.error || JSON.stringify(d)));
    }
    veTomTat(d);
    veBang(d.pages);
  } catch (e) {
    $("tomtat").innerHTML = '<span class="cao">' + e.message + "</span>";
  }
  $("chay").disabled = false;
};

function veTomTat(d) {
  const giam = d.rawChars ? (100 * (d.rawChars - d.cleanChars) / d.rawChars).toFixed(2) : 0;
  $("tomtat").innerHTML =
    "<b>" + d.totalPages + "</b> trang · đổi <b>" + d.changed +
    "</b> · nguyên <b>" + d.untouched +
    "</b> · giảm <b>" + giam + "%</b> ký tự · <b>" + d.elapsedMs + "</b> ms";
}

function veBang(pages) {
  const tb = $("bang");
  if (!pages.length) {
    tb.innerHTML = '<tr><td colspan="5" class="trong">Không trang nào thay đổi</td></tr>';
    return;
  }
  tb.innerHTML = "";
  for (const p of pages) {
    const tr = document.createElement("tr");
    tr.innerHTML =
      '<td class="duong">' + p.path + "</td>" +
      "<td>" + (p.nbsp || "") + "</td>" +
      "<td>" + (p.fence || "") + "</td>" +
      "<td>" + p.removed + "</td>" +
      '<td class="phantram' + (p.percent >= 20 ? " cao" : "") + '">' + p.percent + "</td>";
    tr.onclick = () => moTrang(p.path, tr);
    tb.appendChild(tr);
  }
}

async function moTrang(duong, tr) {
  if (dangChon) dangChon.classList.remove("chon");
  dangChon = tr;
  tr.classList.add("chon");

  $("chitiet").innerHTML = '<div class="trong">đang tải…</div>';
  const r = await fetch("/api/page?path=" + encodeURIComponent(duong));
  const d = await r.json();
  $("chitiet").innerHTML =
    '<div class="nhan">' + d.path + "</div>" +
    '<div class="cot2">' +
      '<div><div class="nhan">trước — ' + d.rawChars + " ký tự</div><pre>" + esc(d.raw) + "</pre></div>" +
      '<div><div class="nhan">sau — ' + d.cleanChars + " ký tự</div><pre>" + esc(d.clean) + "</pre></div>" +
    "</div>";
}

const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
</script>
</body>
</html>
