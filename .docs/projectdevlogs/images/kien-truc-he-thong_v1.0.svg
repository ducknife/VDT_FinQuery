<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 800" width="1210" height="800" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f1f1f">
  <!-- Kiến trúc hệ thống FinQuery, phong cách theo sơ đồ "Spring Microservices in Action" -->
  <defs>
    <!-- máy chủ 3 tầng: đỏ = thành phần của FinQuery, xám đen = hạ tầng -->
    <symbol id="srv-red" viewBox="0 0 80 54">
      <g fill="#cf3a43" stroke="#a3262f" stroke-width="1.5">
        <rect x="1" y="1" width="78" height="15" rx="5"/>
        <rect x="1" y="19.5" width="78" height="15" rx="5"/>
        <rect x="1" y="38" width="78" height="15" rx="5"/>
      </g>
      <g fill="#ffffff">
        <rect x="7" y="5" width="7" height="7" rx="1.5"/><rect x="18" y="5" width="46" height="7" rx="3.5"/>
        <rect x="7" y="23.5" width="7" height="7" rx="1.5"/><rect x="18" y="23.5" width="46" height="7" rx="3.5"/>
        <rect x="7" y="42" width="7" height="7" rx="1.5"/><rect x="18" y="42" width="46" height="7" rx="3.5"/>
      </g>
    </symbol>
    <symbol id="srv-dark" viewBox="0 0 80 54">
      <g fill="#3a3a3c" stroke="#1d1d1f" stroke-width="1.5">
        <rect x="1" y="1" width="78" height="15" rx="5"/>
        <rect x="1" y="19.5" width="78" height="15" rx="5"/>
        <rect x="1" y="38" width="78" height="15" rx="5"/>
      </g>
      <g fill="#ffffff">
        <rect x="7" y="5" width="7" height="7" rx="1.5"/><rect x="18" y="5" width="46" height="7" rx="3.5"/>
        <rect x="7" y="23.5" width="7" height="7" rx="1.5"/><rect x="18" y="23.5" width="46" height="7" rx="3.5"/>
        <rect x="7" y="42" width="7" height="7" rx="1.5"/><rect x="18" y="42" width="46" height="7" rx="3.5"/>
      </g>
    </symbol>
    <!-- cơ sở dữ liệu -->
    <symbol id="db" viewBox="0 0 52 62">
      <path d="M2,9 V52 A24,8 0 0 0 50,52 V9" fill="#3a3a3c"/>
      <ellipse cx="26" cy="9" rx="24" ry="8" fill="#3a3a3c" stroke="#ffffff" stroke-width="1.6"/>
      <path d="M2,24 A24,8 0 0 0 50,24 M2,38 A24,8 0 0 0 50,38" fill="none" stroke="#ffffff" stroke-width="2"/>
    </symbol>
    <!-- token -->
    <symbol id="tag" viewBox="0 0 28 20">
      <path d="M10,1.5 H26.5 V18.5 H10 L1.5,10 Z" fill="#a9d9ef" stroke="#2c6c8a" stroke-width="1.4" stroke-linejoin="round"/>
      <circle cx="9" cy="10" r="2.2" fill="#ffffff" stroke="#2c6c8a" stroke-width="1"/>
    </symbol>
    <!-- màn hình giao diện -->
    <symbol id="monitor" viewBox="0 0 80 70">
      <rect x="2" y="2" width="76" height="52" rx="4" fill="#cfe6bd" stroke="#4f6b3d" stroke-width="2"/>
      <rect x="9" y="9" width="62" height="38" rx="2" fill="#ffffff" stroke="#4f6b3d" stroke-width="1.2"/>
      <rect x="34" y="54" width="12" height="9" fill="#cfe6bd" stroke="#4f6b3d" stroke-width="1.6"/>
      <rect x="22" y="62" width="36" height="6" rx="2" fill="#cfe6bd" stroke="#4f6b3d" stroke-width="1.6"/>
    </symbol>
    <!-- người dùng -->
    <linearGradient id="person-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d4d4f"/>
      <stop offset="1" stop-color="#a7a7a9"/>
    </linearGradient>
    <symbol id="person" viewBox="0 0 80 100">
      <path d="M40,6 C27,6 19,16 19,30 C19,40 24,48 30,52 C14,56 6,68 6,98 H74 C74,68 66,56 50,52 C56,48 61,40 61,30 C61,16 53,6 40,6 Z" fill="url(#person-fill)"/>
    </symbol>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f1f1f"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect width="1210" height="800" fill="#ffffff"/>

  <!-- ngoài hệ thống: dịch vụ model -->
  <use href="#srv-dark" x="880" y="14" width="80" height="54"/>
  <text x="972" y="34">DeepInfra API</text>
  <text x="972" y="51" font-size="12" fill="#4a4a4a">Claude Sonnet 5.5 · Qwen3 Embedding</text>
  <text x="972" y="66" font-size="12" fill="#4a4a4a">Qwen3 Reranker · OCR</text>

  <!-- ranh giới hệ thống -->
  <rect x="170" y="118" width="1010" height="660" rx="6" fill="none" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="7 5"/>

  <!-- người dùng -->
  <text x="75" y="330" text-anchor="middle">Client</text>
  <use href="#person" x="35" y="342" width="80" height="100"/>

  <!-- Keycloak + Mailpit -->
  <text x="290" y="468" text-anchor="middle">Docker container</text>
  <rect x="228" y="476" width="124" height="104" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="6 4"/>
  <use href="#srv-dark" x="250" y="486" width="80" height="54"/>
  <text x="290" y="564" text-anchor="middle">Keycloak</text>

  <text x="290" y="640" text-anchor="middle">Docker container</text>
  <rect x="228" y="648" width="124" height="104" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="6 4"/>
  <use href="#srv-dark" x="250" y="658" width="80" height="54"/>
  <text x="290" y="736" text-anchor="middle">Mailpit</text>
  <line x1="290" y1="582" x2="290" y2="626" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ah-gray)"/>
  <text x="298" y="608" font-size="12" fill="#4a4a4a">Email xác minh</text>

  <!-- Client <-> Keycloak: đăng nhập, nhận token -->
  <line x1="112" y1="452" x2="226" y2="512" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="226" y1="530" x2="100" y2="464" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#ah)"/>
  <text transform="translate(172 470) rotate(27.8)" font-size="12">Đăng nhập</text>
  <text transform="translate(112 488) rotate(27.8)" font-size="12">Token</text>
  <use href="#tag" x="0" y="0" width="28" height="20" transform="translate(72 508) rotate(-30)"/>

  <!-- Client <-> core: câu hỏi kèm token, trả lời stream -->
  <line x1="122" y1="372" x2="390" y2="372" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="390" y1="394" x2="122" y2="394" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="250" y="364" text-anchor="middle" font-size="12">Câu hỏi + Bearer token</text>
  <text x="250" y="412" text-anchor="middle" font-size="12">Trả lời (SSE stream)</text>
  <use href="#tag" x="0" y="0" width="28" height="20" transform="translate(346 346) rotate(-30)"/>

  <!-- core kiểm token bằng khoá công khai của Keycloak -->
  <line x1="390" y1="528" x2="354" y2="528" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ah-gray)"/>
  <text x="372" y="546" text-anchor="middle" font-size="11" fill="#4a4a4a">JWKS</text>

  <!-- MySQL -->
  <text x="608" y="142" text-anchor="middle">MySQL</text>
  <text x="608" y="158" text-anchor="middle" font-size="12" fill="#4a4a4a">tài liệu · số liệu tài chính · hội thoại · feedback</text>
  <use href="#db" x="582" y="166" width="52" height="62"/>
  <line x1="608" y1="231" x2="608" y2="260" stroke="#1f1f1f" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="618" y="250" font-size="12">Đọc / ghi dữ liệu</text>

  <!-- core <-> DeepInfra -->
  <line x1="790" y1="262" x2="884" y2="76" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="902" y1="80" x2="808" y2="266" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#ah)"/>
  <text transform="translate(792 228) rotate(-63.2)" font-size="12">Gọi model (HTTPS)</text>

  <!-- FinQuery core -->
  <rect x="392" y="262" width="432" height="482" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="608" y="284" text-anchor="middle" font-weight="bold">FinQuery core</text>

  <!-- Agent loop -->
  <rect x="405" y="296" width="190" height="120" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  <use href="#srv-red" x="417" y="304" width="80" height="54"/>
  <use href="#srv-red" x="503" y="304" width="80" height="54"/>
  <text x="500" y="376" text-anchor="middle">Agent loop</text>
  <rect x="415" y="384" width="170" height="24" fill="#efeee6" stroke="#6e6e6e" stroke-width="1"/>
  <text x="500" y="400" text-anchor="middle" font-size="11">Plan → Tools → Answer → Verify</text>

  <!-- Conversation & feedback -->
  <rect x="625" y="296" width="185" height="120" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  <use href="#srv-red" x="635" y="304" width="80" height="54"/>
  <use href="#srv-red" x="720" y="304" width="80" height="54"/>
  <text x="717.5" y="376" text-anchor="middle">Conversation &amp; feedback</text>
  <rect x="635" y="384" width="165" height="24" fill="#efeee6" stroke="#6e6e6e" stroke-width="1"/>
  <text x="717.5" y="400" text-anchor="middle" font-size="11">Compaction · Lessons</text>
  <line x1="623" y1="350" x2="597" y2="350" stroke="#1f1f1f" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- DB query tools -->
  <rect x="405" y="456" width="190" height="120" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  <use href="#srv-red" x="417" y="464" width="80" height="54"/>
  <use href="#srv-red" x="503" y="464" width="80" height="54"/>
  <text x="500" y="536" text-anchor="middle">DB query tools</text>
  <rect x="415" y="544" width="170" height="24" fill="#efeee6" stroke="#6e6e6e" stroke-width="1"/>
  <text x="500" y="560" text-anchor="middle" font-size="11">SQL templates → Java compute</text>

  <!-- Hierarchical RAG -->
  <rect x="625" y="456" width="185" height="120" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  <use href="#srv-red" x="635" y="464" width="80" height="54"/>
  <use href="#srv-red" x="720" y="464" width="80" height="54"/>
  <text x="717.5" y="536" text-anchor="middle">Hierarchical RAG</text>
  <rect x="635" y="544" width="165" height="24" fill="#efeee6" stroke="#6e6e6e" stroke-width="1"/>
  <text x="717.5" y="560" text-anchor="middle" font-size="11">Normalize · Search · Rerank</text>

  <!-- agent gọi hai nhánh -->
  <line x1="500" y1="418" x2="500" y2="454" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="508" y="440" font-size="12">Tool SQL</text>
  <line x1="590" y1="418" x2="650" y2="454" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="634" y="434" font-size="12">Tool tìm tài liệu</text>

  <!-- Ingestion pipeline -->
  <rect x="405" y="606" width="405" height="124" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  <use href="#srv-red" x="522" y="614" width="80" height="54"/>
  <use href="#srv-red" x="612" y="614" width="80" height="54"/>
  <text x="607.5" y="686" text-anchor="middle">Ingestion pipeline</text>
  <rect x="415" y="696" width="385" height="24" fill="#efeee6" stroke="#6e6e6e" stroke-width="1"/>
  <text x="607.5" y="712" text-anchor="middle" font-size="12">OCR → Clean → Chunk → Embed → Extract figures</text>

  <!-- Qdrant -->
  <text x="967" y="452" text-anchor="middle">Docker container</text>
  <rect x="905" y="460" width="124" height="104" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="6 4"/>
  <use href="#srv-dark" x="927" y="470" width="80" height="54"/>
  <text x="967" y="544" text-anchor="middle">Qdrant</text>
  <text x="967" y="558" text-anchor="middle" font-size="12" fill="#4a4a4a">(vector DB)</text>
  <line x1="812" y1="512" x2="902" y2="512" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="857" y="504" text-anchor="middle" font-size="12">Tìm vector</text>
  <text x="857" y="528" text-anchor="middle" font-size="12">(top 80)</text>
  <line x1="812" y1="636" x2="924" y2="568" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#ah)"/>
  <text transform="translate(840 606) rotate(-31.3)" font-size="12">Ghi vector</text>

  <!-- Qdrant dashboard -->
  <use href="#monitor" x="1072" y="474" width="80" height="70"/>
  <text x="1112" y="562" text-anchor="middle">Qdrant</text>
  <text x="1112" y="576" text-anchor="middle">dashboard</text>
  <line x1="1068" y1="506" x2="1032" y2="506" stroke="#1f1f1f" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="1050" y="498" text-anchor="middle" font-size="12">Query</text>

  <!-- kho tài liệu -->
  <use href="#db" x="941" y="636" width="52" height="62"/>
  <text x="967" y="716" text-anchor="middle">Kho tài liệu</text>
  <text x="967" y="730" text-anchor="middle" font-size="12" fill="#4a4a4a">(PDF, OCR)</text>
  <line x1="812" y1="676" x2="936" y2="672" stroke="#1f1f1f" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="874" y="694" text-anchor="middle" font-size="12">Đọc PDF · ghi OCR</text>
</svg>
