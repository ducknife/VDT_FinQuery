spring:
  application: 
    name: finq
  config:
    import: optional:file:.env[.properties]
  datasource: 
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

agent: 
  max-turn-loop: 4

ocr: 
  output-dir: ${OCR_OUTPUT_DIR:../../data/ocr}
  model: ${OCR_MODEL}
  api-url: ${LLM_API_URL}
  api-key: ${LLM_API_KEY}
  dpi: 170
  jpeg-quality: 0.85
  concurrency: 6
  max-tokens: 6000
  first-chunk-timeout: 120s
  silence-timeout: 30s
  total-timeout: 900s
  max-attempts: 6
  dpi-ladder: [0, 0, 130, 130, 110, 110]
  # trial:
  #   enabled: true

cleaner:
  # trial:
  #   enabled: true
  test-api:
    enabled: true

indexing:
  max-chunk-chars: 4000
  stitch-max-chars: 500
  model-limit-chars: 50000

embedding:
  api-url: ${EMBEDDING_API_URL:https://viettelai.vn/model-as-a-service/v1/embeddings}
  api-key: ${LLM_API_KEY}
  model: ${EMBEDDING_MODEL}
  dimensions: 2560
  batch-size: 32
  request-timeout: 120s
  max-attempts: 3
  trial:
    enabled: true
