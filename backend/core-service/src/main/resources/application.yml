spring:
  application: 
    name: finq
  config:
    import: optional:file:.env[.properties]
  datasource: 
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/finquery}
  ai:
    model:
      chat: openai
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      base-url: https://api.deepinfra.com/v1/openai
      api-key: ${LLM_API_KEY}
      chat:
        completions-path: /chat/completions
        options:
          model: ${REASONING_MODEL}
          temperature: 0.0
          max-tokens: 6000
    retry:
      max-attempts: 3

agent:
  max-turn-loop: 4

# bật kiểm token Keycloak (QĐ-038)
finq:
  security:
    enabled: ${FINQ_SECURITY_ENABLED:true}
  # core gọi Keycloak Admin API bằng tài khoản dịch vụ finquery-core: quản lý người dùng, mail đặt lại mật khẩu
  keycloak:
    url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: finquery
    client-id: finquery-core
    client-secret: ${KEYCLOAK_CORE_CLIENT_SECRET:}
    frontend-url: ${FINQ_FRONTEND_URL:http://localhost:5173/}

answer:
  # trial:
  #   enabled: true

llm:
  model: ${REASONING_MODEL}
  thinking: true
  # Sonnet 5.5, USD / 1 triệu token
  price-input-per-million: 2.00
  price-output-per-million: 10.00

generation:
  context-limit-tokens: 64000

financial-query:
  readonly-username: ${DB_READONLY_USERNAME:}
  readonly-password: ${DB_READONLY_PASSWORD:}

ocr: 
  output-dir: ${OCR_OUTPUT_DIR:../../data/ocr}
  model: ${OCR_MODEL}
  api-url: ${LLM_API_URL}
  api-key: ${LLM_API_KEY}
  dpi: 170
  jpeg-quality: 0.85
  concurrency: 6
  max-tokens: 6000
  first-chunk-timeout: 120s
  silence-timeout: 30s
  total-timeout: 900s
  max-attempts: 6
  dpi-ladder: [0, 0, 130, 130, 110, 110]
  # trial:
  #   enabled: true

cleaner:
  # trial:
  #   enabled: true
  test-api:
    enabled: true

ingestion:
  raw-dir: ${RAW_DIR:../../data/raw}
  upload-dir: tai_len

indexing:
  max-chunk-chars: 4000
  stitch-max-chars: 500
  model-limit-chars: 50000
  table-format: json
  corpus-normalization: false

qdrant:
  host: ${QDRANT_HOST:localhost}
  grpc-port: ${QDRANT_GRPC_PORT:6334}
  collection: ${QDRANT_COLLECTION:finq_pages_qwen3e8b}
  upsert-batch-size: 64
  timeout: 30s

embedding:
  api-url: ${EMBEDDING_API_URL}
  api-key: ${LLM_API_KEY}
  model: ${EMBEDDING_MODEL}
  dimensions: ${EMBEDDING_DIMENSIONS}
  batch-size: 32
  request-timeout: 120s
  max-attempts: 3
  # trial:
  #   enabled: true

retrieval:
  top-k: 80
  tier1-keep: 40
  final-k: 20
  min-filtered-hits: 5

rerank:
  api-url: ${RERANK_API_URL}
  api-key: ${LLM_API_KEY}
  tier1-model: ${RANKER_LAYER_1ST_MODEL:}
  tier2-model: ${RANKER_LAYER_2ND_MODEL:}
  batch-size: 40
  request-timeout: 60s
  max-attempts: 3
