spring:
  application: 
    name: finq
  config:
    import: optional:file:.env[.properties]
  datasource: 
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

agent: 
  max-turn-loop: 4

ocr: 
  output-dir: ${OCR_OUTPUT_DIR:../../data/ocr}
  model: ${OCR_MODEL}
  api-url: ${LLM_API_URL}
  api-key: ${LLM_API_KEY}
  dpi: 170
  jpeg-quality: 0.85
  concurrency: 6
  max-tokens: 6000
  first-chunk-timeout: 120s
  silence-timeout: 30s
  total-timeout: 900s
  max-attempts: 6
  dpi-ladder: [0, 0, 130, 130, 110, 110]
  # trial:
  #   enabled: true

cleaner:
  # trial:
  #   enabled: true
  test-api:
    enabled: true

ingestion:
  raw-dir: ${RAW_DIR:../../data/raw}
  upload-dir: tai_len

indexing:
  max-chunk-chars: 4000
  stitch-max-chars: 500
  model-limit-chars: 50000
  table-format: json
  # chuẩn hoá văn bản đem embed (QĐ-027); bật thì phải đổi QDRANT_COLLECTION cùng lúc
  corpus-normalization: false

qdrant:
  host: ${QDRANT_HOST:localhost}
  grpc-port: ${QDRANT_GRPC_PORT:6334}
  collection: ${QDRANT_COLLECTION:finq_pages_qwen3e8b}
  upsert-batch-size: 64
  timeout: 30s

embedding:
  api-url: ${EMBEDDING_API_URL}
  api-key: ${LLM_API_KEY}
  model: ${EMBEDDING_MODEL}
  dimensions: ${EMBEDDING_DIMENSIONS}
  batch-size: 32
  request-timeout: 120s
  max-attempts: 3
  # trial:
  #   enabled: true

# truy hồi (QĐ-030): Qdrant 80 chunk có lọc -> rerank tầng 1 giữ 40 -> tầng 2 giữ 20. Model rerank để trống = bỏ tầng đó
retrieval:
  top-k: 80
  tier1-keep: 40
  final-k: 20
  min-filtered-hits: 5

rerank:
  api-url: ${RERANK_API_URL}
  api-key: ${LLM_API_KEY}
  tier1-model: ${RANKER_LAYER_1ST_MODEL:}
  tier2-model: ${RANKER_LAYER_2ND_MODEL:}
  batch-size: 40
  request-timeout: 60s
  max-attempts: 3
