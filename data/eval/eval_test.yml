  cau_hoi: Vì sao lợi nhuận sau thuế trên báo cáo tài chính riêng quý 2/2024 tăng so với cùng kỳ?
  bien_the:
  - cau_vi_sao
  - pham_vi_rieng
  dap_an: 'LNST riêng quý II/2024 đạt 139,3 tỷ, tăng 20,8 tỷ (17,6%) so với cùng kỳ 2023: doanh thu tăng 2% (2.217,5 tỷ), chi phí tài chính giảm
    30% (14,5 tỷ), chi phí quản lý doanh nghiệp giảm 52% (24,6 tỷ).'
